[build-system]
requires = ["setuptools==84.0.0"]  # pinned: the released wheel is byte-identical to the one the release qualified
build-backend = "setuptools.build_meta"

[project]
name = "ophiolite"
dynamic = ["version"]  # E17p D3: the release name, written into ophiolite/_version.py by the night's release commit
description = "Preview scientific client for Ophiolite"
readme = "README.md"  # E164: the quick start is the PyPI page (the long description in METADATA)
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["anyio>=4.2,<5", "httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.urls]  # E164: Source and Changelog are written by tools/render-sdk-address.py from destinations.json (sdk_git.live)
Homepage = "https://ophiolite.dev/"
Documentation = "https://ophiolite.dev/docs/"
Source = "https://github.com/ophiolite-labs/ophiolite-sdk"
Changelog = "https://github.com/ophiolite-labs/ophiolite-sdk/blob/main/CHANGELOG.md"

[project.scripts]
ophiolite = "ophiolite.cli:entrypoint"

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2"]
lasio = ["lasio>=0.32"]  # E126a: ophiolite.lasio (to_lasio, lasio_bytes, curves_from_lasio)
validation = ["jsonschema>=4.26"]
telemetry = ["opentelemetry-api>=1.37"]  # E95: the reported model on the caller's span
starter = ["pyproj>=3.6", "lasio>=0.32"]  # E129 Sa: ophiolite starter build (well heads, LAS heads)
zgy = ["pyzgy==0.1.1"]  # E123 SZ: ophiolite.zgy; pyzgy pulls segyio (LGPL-3.0), so this stays an extra, never in the server image
folder = ["pandas>=2", "pyarrow>=18", "pyproj>=3.6"]  # E117 s1: ophiolite.folder.write_folder (a project folder /2 from a data frame)
descriptors-test = ["mlcroissant==1.1.1", "roc-validator==0.13.1"]  # E147 s0 (D5): test-only; never a runtime dependency nor in the server image
pack = ["segyio==1.9.14", "lasio>=0.32", "numpy", "matplotlib"]  # E129 (e): the pack notebook; segyio is LGPL-3.0, only here, in zgy (through pyzgy) and in dev
dev = ["pytest>=8", "build>=1", "jsonschema>=4.26", "lasio>=0.32", "pyproj>=3.6", "opentelemetry-sdk>=1.37", "segyio==1.9.14",
       "pyarrow>=18", "geopandas>=1",  # E117 s1 (D5): write_folder's tests and their GeoParquet reader
       'tomli>=2; python_version < "3.11"',  # E148 S-11: the tests read pyproject.toml with tomllib, which 3.10 lacks
       # E123 SZ (D7): the ZGY decoding tests (segyio, above, is their SEG-Y oracle); pyzgy is installed where segyio has a wheel
       'pyzgy==0.1.1; sys_platform == "linux" and platform_machine == "x86_64"']

[tool.setuptools.dynamic]
version = {attr = "ophiolite._version.__version__"}

[tool.setuptools.packages.find]
include = ["ophiolite*"]

[tool.setuptools.package-data]
ophiolite = ["contracts/**/*", "contracts/*", "skills/*/SKILL.md", "templates/*", "templates/**/*", "reference/*", "reference/**/*", "procedure_templates/*", "procedure_templates/**/*", "schemas/*", "table_kind_units.json"]  # E203 s1: the offline check's unit table; E31: ophiolite init copies the packaged templates; E119b: the reference procedures

[tool.setuptools.exclude-package-data]
ophiolite = ["templates/*/node_modules/**/*", "templates/*/node_modules/*", "templates/*/dist/**/*", "templates/**/__pycache__/*", "reference/**/__pycache__/*"]
