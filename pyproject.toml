[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophiolite"
version = "0.1.0"
description = "Preview scientific client for Ophiolite"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["anyio>=4.2,<5", "httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.scripts]
ophiolite = "ophiolite.cli:entrypoint"

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2"]
validation = ["jsonschema>=4.26"]
dev = ["pytest>=8", "build>=1", "jsonschema>=4.26", "lasio>=0.32"]

[tool.setuptools.packages.find]
include = ["ophiolite*"]

[tool.setuptools.package-data]
ophiolite = ["contracts/**/*", "contracts/*", "skills/*/SKILL.md", "templates/*", "templates/**/*"]  # E31: ophiolite init copies the packaged templates

[tool.setuptools.exclude-package-data]
ophiolite = ["templates/*/node_modules/**/*", "templates/*/node_modules/*", "templates/*/dist/**/*", "templates/**/__pycache__/*"]
