[build-system]
requires = ["setuptools==84.0.0"]  # pinned: the released wheel is byte-identical to the one the release qualified
build-backend = "setuptools.build_meta"

[project]
name = "ophiolite"
dynamic = ["version"]  # E17p D3: the release name, written into ophiolite/_version.py by the night's release commit
description = "Preview scientific client for Ophiolite"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["anyio>=4.2,<5", "httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.scripts]
ophiolite = "ophiolite.cli:entrypoint"

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2"]
lasio = ["lasio>=0.32"]  # E126a: ophiolite.lasio (to_lasio, lasio_bytes, curves_from_lasio)
validation = ["jsonschema>=4.26"]
telemetry = ["opentelemetry-api>=1.37"]  # E95: the reported model on the caller's span
starter = ["pyproj>=3.6", "lasio>=0.32"]  # E129 Sa: ophiolite starter build (well heads, LAS heads)
zgy = ["pyzgy==0.1.1"]  # E123 SZ: ophiolite.zgy; pyzgy pulls segyio (LGPL-3.0), so this stays an extra, never in the server image
pack = ["segyio==1.9.14", "lasio>=0.32", "numpy", "matplotlib"]  # E129 (e): the pack notebook; segyio is LGPL-3.0, only here, in zgy (through pyzgy) and in dev
dev = ["pytest>=8", "build>=1", "jsonschema>=4.26", "lasio>=0.32", "pyproj>=3.6", "opentelemetry-sdk>=1.37", "segyio==1.9.14",
       # E123 SZ (D7): the ZGY decoding tests (segyio, above, is their SEG-Y oracle); pyzgy is installed where segyio has a wheel
       'pyzgy==0.1.1; sys_platform == "linux" and platform_machine == "x86_64"']

[tool.setuptools.dynamic]
version = {attr = "ophiolite._version.__version__"}

[tool.setuptools.packages.find]
include = ["ophiolite*"]

[tool.setuptools.package-data]
ophiolite = ["contracts/**/*", "contracts/*", "skills/*/SKILL.md", "templates/*", "templates/**/*", "reference/*", "reference/**/*", "procedure_templates/*", "procedure_templates/**/*", "schemas/*"]  # E31: ophiolite init copies the packaged templates; E119b: the reference procedures

[tool.setuptools.exclude-package-data]
ophiolite = ["templates/*/node_modules/**/*", "templates/*/node_modules/*", "templates/*/dist/**/*", "templates/**/__pycache__/*", "reference/**/__pycache__/*"]
