name: SDK preview checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,numpy,pandas,validation]'
      - run: python tools/generate_models.py --check
      - run: python -m build
      - run: python tools/check_public_inputs.py --artifact dist/ophiolite-0.1.0-py3-none-any.whl --artifact dist/ophiolite-0.1.0.tar.gz
      - run: python -m venv .wheel && .wheel/bin/python -m pip install dist/ophiolite-0.1.0-py3-none-any.whl
      - run: OPHIOLITE_TEST_WHEEL_PYTHON="$PWD/.wheel/bin/python" OPHIOLITE_TEST_DIST=dist python -m pytest -q tests --ignore=tests/gateway
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: python tools/generate_ts_client.py --check
      - run: npm ci --ignore-scripts --prefix packages/typescript
      - run: npm test --prefix packages/typescript
      - run: npm pack --dry-run
        working-directory: packages/typescript
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ophiolite/templates/map-application/package-lock.json
      - run: python -m pip install -r ophiolite/templates/notebook/requirements.lock
      - run: python -m pip install --no-deps .
      - run: npm ci --ignore-scripts
        working-directory: ophiolite/templates/map-application
      - run: npx playwright install --with-deps chromium
        working-directory: ophiolite/templates/map-application
      - run: OPHIOLITE_RUN_TEMPLATES=1 python -m pytest -q tests/test_templates.py tests/test_init_wheel.py tests/test_gallery.py
