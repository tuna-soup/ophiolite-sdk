# E17p D9: PyPI by trusted publishing (OIDC), never a password. The release step pushes the tag v<N>; `build` makes the
# sdist and wheel once, the release step qualifies that `dist` artifact, then approves the `pypi` environment, whose job
# uploads exactly those files. A workflow_dispatch is the TestPyPI probe (P3): a renamed 0.0.* build, `testpypi` only.
name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: The tag names the commit this job builds
        if: github.event_name == 'push'
        run: test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - run: python -m pip install 'build==1.2.2.post1'
      - run: python -m build
      - name: The distribution's name and version fit the event
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'EOF'
          import glob, os, sys, zipfile
          (wheel,) = glob.glob('dist/*-py3-none-any.whl')
          with zipfile.ZipFile(wheel) as z:
              (meta,) = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
              head = dict(l.split(': ', 1) for l in z.read(meta).decode().splitlines() if ': ' in l and l[:1] != ' ')
          name, version = head['Name'], head['Version']
          if os.environ['EVENT'] == 'push':
              tag = os.environ['GITHUB_REF_NAME']
              ok = name == 'ophiolite' and 'v' + version == tag
          else:  # the TestPyPI probe: never the real name, only a 0.0.* version
              ok = name != 'ophiolite' and version.startswith('0.0.')
          print(name, version, 'fits' if ok else 'does not fit', os.environ['EVENT'])
          sys.exit(0 if ok else 1)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  pypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ophiolite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
